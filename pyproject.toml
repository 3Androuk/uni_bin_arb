[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uni-bin-arb"
version = "0.1.0"
description = "Read-only Uniswap V3 / Binance CEX-DEX arbitrage research system"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "eth-abi>=5.0,<6",
  "eth-utils>=5.0,<6",
  "python-dotenv>=1.0,<2",
  "requests>=2.31,<3",
  "tomli>=2.0,<3; python_version < '3.11'",
  "web3>=7.0,<8",
  "websockets>=12,<16",
]

[project.optional-dependencies]
research = ["jupyter>=1.0,<2", "matplotlib>=3.8,<4", "pandas>=2.1,<3"]
test = ["pytest>=8,<10", "pytest-cov>=5,<8"]

[project.scripts]
uni-bin-arb = "scr.app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scr", "scr.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

